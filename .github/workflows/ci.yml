name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # A service container rather than the npm-packaged Postgres used locally:
    # CI already has a container runtime, so there is no reason to reach for the
    # workaround that exists for machines that don't.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://relay:relay@localhost:5433/relay
      TEST_ADMIN_URL: postgres://relay:relay@localhost:5433/postgres
      TEST_DATABASE_URL: postgres://relay:relay@localhost:5433/relay_test

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Not --frozen-lockfile: the lockfile is resolved on macOS, so it records
      # only the darwin variants of platform-specific optional dependencies
      # (argon2, the Postgres binaries). A Linux runner legitimately needs to
      # add its own, which a frozen install refuses to do.
      - run: bun install

      - name: Lint and format check
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # `bun --filter <pkg> <script>` -- inserting `run` makes Bun look for a
      # script literally named "run".
      - name: Build web
        run: bun --filter '@relay/web' build
