<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Relay — offline</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0e1014;
        color: #cbd5e1;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main { max-width: 28rem; padding: 0 1.5rem; text-align: center; }
      h1 { font-size: 1.25rem; font-weight: 600; color: #fff; margin: 0 0 0.5rem; }
      p { font-size: 0.875rem; line-height: 1.6; color: #94a3b8; margin: 0 0 1.5rem; }
      button {
        border: 1px solid #252a33;
        background: #16191f;
        color: #e2e8f0;
        border-radius: 0.375rem;
        padding: 0.5rem 1rem;
        font-size: 0.875rem;
        cursor: pointer;
      }
      button:hover { border-color: #475569; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        This page hasn't been visited yet, so there's no cached copy. Boards you
        have already opened still work offline — your unsynced changes are saved
        on this device and will upload when you reconnect.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
